<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>L1 中间层 · iframe 内 + Shadow</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 12px; color: #123; background: #f5fbff; }
    h2 { font-size: 15px; color: #036; }
    .region { border: 1px solid #cde; border-radius: 8px; padding: 8px; margin: 8px 0; }
    .tag { font-size: 12px; color: #678; }
    [contenteditable] { min-height: 34px; border: 1px dashed #9bc; border-radius: 6px; padding: 6px; background: #fff; }
    iframe { border: 1px solid #bcd; border-radius: 6px; background: #fff; }
    .shadow-host { display: block; border: 1px solid #0cc; border-radius: 8px; padding: 8px; background: #eefcff; }
    #check-btn { padding: 5px 10px; border-radius: 6px; border: 1px solid #036; background: #036; color: #fff; cursor: pointer; }
    #check-out { white-space: pre-wrap; font-family: monospace; font-size: 12px; margin-top: 6px; padding: 6px; border-radius: 6px; background: #eef; min-height: 30px; }
    .sel { user-select: text; }
  </style>
</head>
<body>
  <h2>L1 中间层（由 L0 的 iframe 引入）</h2>
  <p class="tag">本层包含：可选中文本、contenteditable、Shadow host（内含 contenteditable + iframe→L2）。</p>

  <button id="check-btn">本帧污染检查</button>
  <pre id="check-out">（在本帧划词后点击检查）</pre>

  <div class="region">
    <div class="tag">① 可选中文本（L1 文档）</div>
    <p class="sel">L1 iframe 文档里的可选中文本，选中它来测试跨帧划词是否仍由顶层渲染工具条。</p>
  </div>

  <div class="region">
    <div class="tag">② contenteditable 编辑区（L1）</div>
    <div contenteditable="true" data-label="L1-编辑区②">L1 描述编辑区…</div>
  </div>

  <div class="region">
    <div class="tag">③ Shadow host —— 影子根内含 contenteditable + iframe→L2</div>
    <div class="shadow-host" data-shadow="sh-l1"></div>
    <template id="sh-l1">
      <div style="padding:4px">
        <p class="sel" style="color:#069">L1 Shadow 内的可选中文本。</p>
        <div contenteditable="true" data-label="L1-Shadow编辑区③"
             style="min-height:30px;border:1px dashed #09c;background:#fff;padding:6px;border-radius:6px">
          L1 Shadow 里的编辑区…
        </div>
        <p style="font-size:12px;color:#678">L1 Shadow 内嵌 iframe → L2：</p>
        <iframe src="nested-shadow-iframe-l2.html" width="440" height="300" title="L1-shadow->L2"></iframe>
      </div>
    </template>
  </div>

  <script src="nested-shadow-checker.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function(){ window.AIShadowNest.init(); });</script>
</body>
</html>
