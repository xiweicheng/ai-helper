<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>L2 最深层 · 叶子（iframe 内 + Shadow）</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 12px; color: #221; background: #fffaf0; }
    h3 { font-size: 14px; color: #630; }
    .region { border: 1px solid #edc; border-radius: 8px; padding: 8px; margin: 8px 0; }
    .tag { font-size: 12px; color: #875; }
    [contenteditable] { min-height: 30px; border: 1px dashed #cba; border-radius: 6px; padding: 6px; background: #fff; }
    .shadow-host { display: block; border: 1px solid #ca8; border-radius: 8px; padding: 8px; background: #fff4e0; }
    #check-btn { padding: 5px 10px; border-radius: 6px; border: 1px solid #630; background: #630; color: #fff; cursor: pointer; }
    #check-out { white-space: pre-wrap; font-family: monospace; font-size: 12px; margin-top: 6px; padding: 6px; border-radius: 6px; background: #fff2d8; min-height: 30px; }
    .sel { user-select: text; }
  </style>
</head>
<body>
  <h3>L2 最深层（叶子，无再嵌套 iframe）</h3>
  <p class="tag">本层包含：可选中文本、contenteditable、Shadow host（内含可选中文本 + contenteditable）。</p>

  <button id="check-btn">本帧污染检查</button>
  <pre id="check-out">（在本帧划词后点击检查）</pre>

  <div class="region">
    <div class="tag">① 可选中文本（L2 文档）</div>
    <p class="sel">这是最深层 iframe 里的可选中文本，选中它验证：修复后本帧不会再被创建工具条 DOM。</p>
  </div>

  <div class="region">
    <div class="tag">② contenteditable 编辑区（L2）</div>
    <div contenteditable="true" data-label="L2-编辑区②">L2 描述编辑区…</div>
  </div>

  <div class="region">
    <div class="tag">③ Shadow host —— 影子根内含可选中文本 + contenteditable</div>
    <div class="shadow-host" data-shadow="sh-l2"></div>
    <template id="sh-l2">
      <div style="padding:4px">
        <p class="sel" style="color:#a60">L2 Shadow 内的可选中文本。</p>
        <div contenteditable="true" data-label="L2-Shadow编辑区③"
             style="min-height:30px;border:1px dashed #ca8;background:#fff;padding:6px;border-radius:6px">
          L2 Shadow 里的编辑区…
        </div>
      </div>
    </template>
  </div>

  <script src="nested-shadow-checker.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function(){ window.AIShadowNest.init(); });</script>
</body>
</html>
