name: Release

# 触发方式：
#   1) 推送 v* 标签（例如 v1.0.0）→ 自动构建并发布到 GitHub + Gitee
#   2) 手动触发（Actions → Release → Run workflow），可指定版本号
#
# 前置配置：
#   在 GitHub 仓库 Settings → Secrets and variables → Actions 添加
#     GITEE_TOKEN = Gitee 私人令牌（权限勾选 projects 即可）
#   未配置时，Gitee 同步步骤会自动跳过并给出 warning。
#   Gitee 两步位于 GitHub Release 之后：失败不会影响已发布的 GitHub 产物，
#   但会把本次 run 标记为失败以提醒人工处理。
#
# 说明：Gitee 的自动构建（Gitee Go）是收费增值服务，本流程不使用它。
#      构建在 GitHub 免费 Runner 上完成，产物通过 Gitee 免费 OpenAPI 推送。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v1.0.0（留空则使用 package.json 中的 version）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Chrome Extension
    runs-on: ubuntu-latest

    env:
      GITEE_OWNER: xiweicheng
      GITEE_REPO: ai-helper
      GITEE_BRANCH: main
      GIT_TERMINAL_PROMPT: 0     # 禁止 git 交互式索要密码，避免 CI 卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史，才能把 tag 同步推送到 Gitee

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/manifest.json ]; then
            echo "::error::dist/manifest.json not found, build failed"
            exit 1
          fi
          du -sh dist

      - name: Resolve release tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Package extension as zip
        id: package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ZIP="ai-helper-${TAG}.zip"
          cd dist
          zip -r "../${ZIP}" .
          cd ..
          ls -lh "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}-zip
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true          # v4 同名构件不可重复创建：显式覆盖，保证重跑可用

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## AI Helper ${{ steps.version.outputs.tag }}

            ### 安装方式
            1. 下载下方 `ai-helper-*.zip` 并解压
            2. 打开 Chrome，访问 `chrome://extensions/`
            3. 打开右上角「开发者模式」
            4. 点击「加载已解压的扩展程序」，选择解压后的文件夹

            > 由 GitHub Actions 自动构建，构建产物为 `dist/` 目录打包。
          files: ai-helper-*.zip
          generate_release_notes: true
          draft: false

      # ==================== 同步发布到 Gitee ====================
      # 实测要点：
      #   1) Gitee 仓库为私有，匿名 ls-remote 会失败 → 探测前必须先装好凭证
      #   2) /releases/tags/<tag> 对不存在的 tag 返回 HTTP 200 + null（非 404）
      #      → 判断是否存在必须看 id 字段是否为空，不能看状态码；
      #        状态码仅用于识别异常响应（401/403/5xx 等）并直接报错
      #   3) /releases/tags/<tag> 与 /releases/{id} 均返回 assets 数组（含自动生成的
      #      源码归档 <tag>.zip/.tar.gz 与手动附件，字段 name/browser_download_url），
      #      附件去重按完整文件名精确匹配即可，自动源码归档不会误判
      - name: Sync tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过 Gitee tag 同步"
            exit 0
          fi

          REMOTE="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"

          # 安装凭证（用 credential store，避免令牌出现在命令行/日志）
          # 先注册清理 trap 再写凭证文件，中途失败也能保证被清理
          trap 'rm -f ~/.git-credentials' EXIT
          git config --local credential.helper store
          echo "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

          if git ls-remote --tags "$REMOTE" "refs/tags/${TAG}" | grep -q .; then
            echo "Gitee 已存在 tag ${TAG}，无需推送"
          elif git push "$REMOTE" "refs/tags/${TAG}"; then
            echo "tag ${TAG} 已推送到 Gitee"
          else
            echo "::warning::tag 推送失败，将改用 target_commitish=${GITEE_BRANCH} 创建发行版"
          fi

      - name: Publish to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning title=跳过 Gitee 发布::未配置 GITEE_TOKEN secret。请在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加 GITEE_TOKEN（Gitee 私人令牌，权限勾选 projects）。"
            exit 0
          fi

          # 1) 查询该 tag 是否已有发行版
          #    注意：tag 不存在时 Gitee 返回 HTTP 200 + body "null"，故只能判 id；
          #    非 200 视为网络/权限异常，直接报错，避免误走创建分支掩盖真实原因
          HTTP_CODE=$(curl -sS -m 30 -o /tmp/gitee_rel.json -w '%{http_code}' \
            "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}") || HTTP_CODE="000"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::查询 Gitee 发行版失败（HTTP ${HTTP_CODE}），请检查网络、仓库名与令牌权限（需勾选 projects）"
            echo "响应: $(head -c 300 /tmp/gitee_rel.json 2>/dev/null || true)"
            exit 1
          fi

          RID=$(jq -r 'if type=="object" then (.id // empty) else empty end' /tmp/gitee_rel.json 2>/dev/null || true)
          if [ -n "$RID" ]; then
            echo "已存在发行版 ${TAG} (id=${RID})，将复用并补充附件"
          fi

          # 2) 不存在则创建
          if [ -z "$RID" ]; then
            cat > /tmp/gitee_body.md <<'EOF'
          ## AI Helper 发布包

          ### 安装方式
          1. 下载下方 `ai-helper-*.zip` 并解压
          2. 打开 Chrome，访问 `chrome://extensions/`
          3. 打开右上角「开发者模式」
          4. 点击「加载已解压的扩展程序」，选择解压后的文件夹

          > 由 GitHub Actions 构建（GitHub 免费 Runner），产物为 `dist/` 目录打包。
          EOF
            HTTP_CODE=$(curl -sS -m 60 -o /tmp/gitee_create.json -w '%{http_code}' -X POST "${API}/releases" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG}" \
              --data-urlencode "name=${TAG}" \
              --data-urlencode "target_commitish=${GITEE_BRANCH}" \
              --data-urlencode "body@/tmp/gitee_body.md") || HTTP_CODE="000"
            CREATE_RESP=$(cat /tmp/gitee_create.json 2>/dev/null || true)
            echo "创建响应(${HTTP_CODE}): $(echo "$CREATE_RESP" | head -c 300)"
            RID=$(echo "$CREATE_RESP" | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
            if [ -z "$RID" ]; then
              # 响应丢失但服务端可能已建成功：复查一次再判定失败
              RID=$(curl -sS -m 30 "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" 2>/dev/null \
                | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
            fi
            if [ -z "$RID" ]; then
              echo "::error::创建 Gitee 发行版失败（HTTP ${HTTP_CODE}），请检查令牌权限（需勾选 projects）与 tag 是否存在"
              exit 1
            fi
            echo "已创建 Gitee 发行版 ${TAG} (id=${RID})"
          fi

          # 3) 以 RID 刷新发行版详情（含附件列表），附件去重必须基于最新快照
          #    注：/releases/tags 查询响应与创建响应都可能不含附件信息
          HTTP_CODE=$(curl -sS -m 30 -o /tmp/gitee_rel.json -w '%{http_code}' \
            "${API}/releases/${RID}?access_token=${GITEE_TOKEN}") || HTTP_CODE="000"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::刷新发行版详情失败（HTTP ${HTTP_CODE}），附件去重判断将不准确"
            echo "null" > /tmp/gitee_rel.json
          fi

          # 4) 上传附件（同名附件已存在则跳过，避免重复）
          #    实测：GitHub 海外 Runner 上传大文件到 gitee.com 易停滞/超时，
          #    故关闭 Expect 握手 + 对停滞连接快速中断 + 自动重试
          CNT=$(jq -r --arg n "$ZIP" '[.. | objects | select(.name? == $n)] | length' /tmp/gitee_rel.json 2>/dev/null || echo 0)
          if [ "${CNT:-0}" -gt 0 ]; then
            echo "附件 ${ZIP} 已存在，跳过上传"
          else
            HTTP_CODE=$(curl -sS -m 300 \
              --connect-timeout 15 \
              --speed-limit 10240 --speed-time 60 \
              --retry 3 --retry-delay 10 \
              -H "Expect:" \
              -o /tmp/gitee_attach.json -w '%{http_code}' \
              -X POST "${API}/releases/${RID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${ZIP}") || HTTP_CODE="000"
            RESP=$(cat /tmp/gitee_attach.json 2>/dev/null || true)
            if echo "$RESP" | jq -e 'if type=="object" then (.browser_download_url // .name // empty) else empty end' >/dev/null 2>&1; then
              echo "附件上传成功：$(echo "$RESP" | jq -r '.browser_download_url // .name')"
            else
              # 超时/断连时服务端可能已实际收到文件：复查一次附件列表再下结论
              sleep 5
              curl -sS -m 30 -o /tmp/gitee_rel_verify.json \
                "${API}/releases/${RID}?access_token=${GITEE_TOKEN}" || true
              CNT2=$(jq -r --arg n "$ZIP" '[.. | objects | select(.name? == $n)] | length' /tmp/gitee_rel_verify.json 2>/dev/null || echo 0)
              if [ "${CNT2:-0}" -gt 0 ]; then
                echo "::warning::上传请求报错（HTTP ${HTTP_CODE}），但复查发现附件 ${ZIP} 已存在，视为成功"
              else
                echo "::error::附件上传失败（HTTP ${HTTP_CODE}）：如为超时，多为海外 Runner 访问 Gitee 上传大文件被限速，可重跑该 job 补传附件"
                echo "$RESP" | head -c 500
                exit 1
              fi
            fi
          fi

          echo "✅ Gitee 发布完成：https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${TAG}"
