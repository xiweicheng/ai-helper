name: Release

# 触发方式：
#   1) 推送 v* 标签（例如 v1.0.0）→ 自动构建并发布到 GitHub + Gitee
#   2) 手动触发（Actions → Release → Run workflow），可指定版本号
#
# 前置配置：
#   在 GitHub 仓库 Settings → Secrets and variables → Actions 添加
#     GITEE_TOKEN = Gitee 私人令牌（权限勾选 projects 即可）
#   未配置时，Gitee 同步步骤会自动跳过并给出 warning。
#   Gitee 两步位于 GitHub Release 之后：失败不会影响已发布的 GitHub 产物，
#   但会把本次 run 标记为失败以提醒人工处理。
#
# 说明：Gitee 的自动构建（Gitee Go）是收费增值服务，本流程不使用它。
#      构建在 GitHub 免费 Runner 上完成；Gitee 端通过免费 OpenAPI 同步
#      发行版与发布说明，并把构建产物 zip 作为发行版附件上传。
#      发布说明中同时保留指向 GitHub Releases 的备用下载链接。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v1.0.0（留空则使用 package.json 中的 version）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Chrome Extension
    runs-on: ubuntu-latest

    env:
      GITEE_OWNER: xiweicheng
      GITEE_REPO: ai-helper
      GITEE_BRANCH: main
      GIT_TERMINAL_PROMPT: 0     # 禁止 git 交互式索要密码，避免 CI 卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史，才能把 tag 同步推送到 Gitee

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/manifest.json ]; then
            echo "::error::dist/manifest.json not found, build failed"
            exit 1
          fi
          du -sh dist

      - name: Resolve release tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Package extension as zip
        id: package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ZIP="ai-helper-${TAG}.zip"
          cd dist
          zip -r "../${ZIP}" .
          cd ..
          ls -lh "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}-zip
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true          # v4 同名构件不可重复创建：显式覆盖，保证重跑可用

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## AI Helper ${{ steps.version.outputs.tag }}

            ### 安装方式
            1. 下载下方 `ai-helper-*.zip` 并解压
            2. 打开 Chrome，访问 `chrome://extensions/`
            3. 打开右上角「开发者模式」
            4. 点击「加载已解压的扩展程序」，选择解压后的文件夹

            > 由 GitHub Actions 自动构建，构建产物为 `dist/` 目录打包。
          files: ai-helper-*.zip
          overwrite_files: true      # 重跑时同名资产直接覆盖，否则报 already_exists 会中断后续 Gitee 步骤
          generate_release_notes: true
          draft: false

      # ==================== 同步发布到 Gitee ====================
      # 实测要点：
      #   1) Gitee 仓库为私有，匿名 ls-remote 会失败 → 探测前必须先装好凭证
      #   2) /releases/tags/<tag> 对不存在的 tag 返回 HTTP 200 + null（非 404）
      #      → 判断是否存在必须看 id 字段是否为空，不能看状态码；
      #        状态码仅用于识别异常响应（401/403/5xx 等）并直接报错
      #   3) 发行版说明可用 PATCH /releases/{id} 更新（复用已存在发行版时用它把
      #      旧说明刷新为含 GitHub Releases 下载链接的新说明）；实测注意：即使只改
      #      body 也必须同时携带 tag_name 与 name，否则报 400 "tag_name/name is missing"
      - name: Sync tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过 Gitee tag 同步"
            exit 0
          fi

          REMOTE="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"

          # 安装凭证（用 credential store，避免令牌出现在命令行/日志）
          # 先注册清理 trap 再写凭证文件，中途失败也能保证被清理
          trap 'rm -f ~/.git-credentials' EXIT
          git config --local credential.helper store
          echo "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

          if git ls-remote --tags "$REMOTE" "refs/tags/${TAG}" | grep -q .; then
            echo "Gitee 已存在 tag ${TAG}，无需推送"
          elif git push "$REMOTE" "refs/tags/${TAG}"; then
            echo "tag ${TAG} 已推送到 Gitee"
          else
            echo "::warning::tag 推送失败，将改用 target_commitish=${GITEE_BRANCH} 创建发行版"
          fi

      - name: Publish to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning title=跳过 Gitee 发布::未配置 GITEE_TOKEN secret。请在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加 GITEE_TOKEN（Gitee 私人令牌，权限勾选 projects）。"
            exit 0
          fi

          # 1) 查询该 tag 是否已有发行版
          #    注意：tag 不存在时 Gitee 返回 HTTP 200 + body "null"，故只能判 id；
          #    非 200 视为网络/权限异常，直接报错，避免误走创建分支掩盖真实原因
          HTTP_CODE=$(curl -sS -m 30 -o /tmp/gitee_rel.json -w '%{http_code}' \
            "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}") || HTTP_CODE="000"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::查询 Gitee 发行版失败（HTTP ${HTTP_CODE}），请检查网络、仓库名与令牌权限（需勾选 projects）"
            echo "响应: $(head -c 300 /tmp/gitee_rel.json 2>/dev/null || true)"
            exit 1
          fi

          RID=$(jq -r 'if type=="object" then (.id // empty) else empty end' /tmp/gitee_rel.json 2>/dev/null || true)
          if [ -n "$RID" ]; then
            echo "已存在发行版 ${TAG} (id=${RID})，将更新发布说明"
          fi

          # 2) 生成发布说明（统一指向 GitHub Releases 下载；Gitee 端不再上传附件）
          GH_RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          cat > /tmp/gitee_body.md <<'EOF'
          ## AI Helper __TAG__ 发布包

          ### 下载
          构建产物 `ai-helper-__TAG__.zip` 已作为本发行版附件提供，可直接在下方 Assets 区下载。

          GitHub Releases 备用地址：
          __URL__

          ### 安装方式
          1. 下载 `ai-helper-__TAG__.zip` 并解压
          2. 打开 Chrome，访问 `chrome://extensions/`
          3. 打开右上角「开发者模式」
          4. 点击「加载已解压的扩展程序」，选择解压后的文件夹

          > 受网络环境所限，Gitee 端仅同步发行版与发布说明，构建产物统一由 GitHub Actions 构建并发布在 GitHub Releases。
          EOF
          sed "s|__TAG__|${TAG}|g; s|__URL__|${GH_RELEASE_URL}|g" /tmp/gitee_body.md > /tmp/gitee_body_final.md

          if [ -z "$RID" ]; then
            # 3a) 不存在则创建
            HTTP_CODE=$(curl -sS -m 60 -o /tmp/gitee_create.json -w '%{http_code}' -X POST "${API}/releases" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG}" \
              --data-urlencode "name=${TAG}" \
              --data-urlencode "target_commitish=${GITEE_BRANCH}" \
              --data-urlencode "body@/tmp/gitee_body_final.md") || HTTP_CODE="000"
            CREATE_RESP=$(cat /tmp/gitee_create.json 2>/dev/null || true)
            echo "创建响应(${HTTP_CODE}): $(echo "$CREATE_RESP" | head -c 300)"
            RID=$(echo "$CREATE_RESP" | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
            if [ -z "$RID" ]; then
              # 响应丢失但服务端可能已建成功：复查一次再判定失败
              RID=$(curl -sS -m 30 "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" 2>/dev/null \
                | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
            fi
            if [ -z "$RID" ]; then
              echo "::error::创建 Gitee 发行版失败（HTTP ${HTTP_CODE}），请检查令牌权限（需勾选 projects）与 tag 是否存在"
              exit 1
            fi
            echo "已创建 Gitee 发行版 ${TAG} (id=${RID})"
          else
            # 3b) 已存在则刷新发布说明（把历史版本的旧说明统一更新为含 GitHub Releases 下载链接的新版）
            #     实测：Gitee 更新接口即使只改 body，也强制要求携带 tag_name 与 name，缺失报 400
            HTTP_CODE=$(curl -sS -m 60 -o /tmp/gitee_update.json -w '%{http_code}' -X PATCH "${API}/releases/${RID}" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG}" \
              --data-urlencode "name=${TAG}" \
              --data-urlencode "body@/tmp/gitee_body_final.md") || HTTP_CODE="000"
            UPDATE_RESP=$(cat /tmp/gitee_update.json 2>/dev/null || true)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::更新 Gitee 发行版说明失败（HTTP ${HTTP_CODE}）"
              echo "$UPDATE_RESP" | head -c 300
              exit 1
            fi
            echo "已更新 Gitee 发行版说明 ${TAG} (id=${RID})"
          fi

          echo "✅ Gitee 发布完成：https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${TAG}"

      - name: Attach zip to Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过 Gitee 附件上传"
            exit 0
          fi

          if [ ! -f "${ZIP}" ]; then
            echo "::error::未找到构建产物 ${ZIP}，无法上传"
            exit 1
          fi

          # 1) 取发行版 id（写接口必须带 token）
          RID=$(curl -sS -m 30 "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" \
            | jq -r 'if type=="object" then (.id // empty) else empty end' 2>/dev/null || true)
          if [ -z "$RID" ]; then
            echo "::error::未找到 Gitee 发行版 ${TAG}，请确认上一步已成功创建"
            exit 1
          fi
          echo "release_id=${RID}"

          # 2) 幂等处理：Gitee 的 attach_files 是「追加」语义，重跑会产生同名重复附件，
          #    故先查出同名附件并按 id 删除，避免同名堆积
          EXISTING=$(curl -sS -m 30 "${API}/releases/${RID}/attach_files?access_token=${GITEE_TOKEN}" || echo '[]')
          echo "现有附件: $(echo "$EXISTING" | head -c 300)"
          echo "$EXISTING" \
            | jq -r --arg n "${ZIP}" '.[]? | select(.name==$n) | .id' 2>/dev/null \
            | while read -r AID; do
                [ -n "$AID" ] || continue
                curl -sS -m 30 -X DELETE \
                  "${API}/releases/${RID}/attach_files/${AID}?access_token=${GITEE_TOKEN}" >/dev/null 2>&1 \
                  && echo "已删除同名旧附件 id=${AID}" \
                  || echo "::warning::删除旧附件 ${AID} 失败（忽略）"
              done || true

          # 3) 上传构建产物
          #    官方端点：POST /repos/{owner}/{repo}/releases/{release_id}/attach_files
          #    表单字段名固定为 file（multipart/form-data）
          echo "开始上传 ${ZIP}（$(du -h "${ZIP}" | cut -f1)）..."
          HTTP_CODE=$(curl -sS -m 600 -o /tmp/gitee_attach.json -w '%{http_code}' \
            -X POST "${API}/releases/${RID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${ZIP}") || HTTP_CODE="000"

          RESP=$(cat /tmp/gitee_attach.json 2>/dev/null || true)
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ 附件上传成功：$(echo "$RESP" | head -c 400)"
          else
            echo "::error::Gitee 附件上传失败（HTTP ${HTTP_CODE}）"
            echo "$RESP" | head -c 500
            exit 1
          fi

          echo "✅ Gitee 发行版：https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${TAG}"
